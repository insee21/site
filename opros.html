<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Форма</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            max-width: 600px;
        }
        h2 {
            font-family: "Times New Roman", Times, serif;
            font-size: 28px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 25px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: inline-block;
            width: 90px;
            vertical-align: top;
        }
        .form-group input[type="text"] {
            width: 180px;
            padding: 2px;
        }
        .radio-group {
            display: inline-block;
        }
        .radio-item {
            margin-bottom: 5px;
        }
        h3 {
            font-size: 16px;
            font-weight: bold;
            margin-top: 25px;
            margin-bottom: 15px;
        }
        select {
            width: 150px;
            padding: 2px;
        }
        .checkbox-group {
            line-height: 1.6;
        }
        textarea {
            width: 450px;
            height: 180px;
            resize: none;
        }
        .buttons-container {
            margin-top: 25px;
        }
        input[type="submit"], input[type="reset"] {
            padding: 5px 20px;
            margin-right: 10px;
            font-size: 14px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h2>Анкета</h2>

    <form action="#" method="post">
        
        <!-- Блок Имя -->
        <div class="form-group">
            <label for="username">Вше имя</label>
            <input type="text" id="username" name="username">
        </div>

        <!-- Блок Пол -->
        <div class="form-group">
            <label>Ваш пол</label>
            <div class="radio-group">
                <div class="radio-item">
                    <input type="radio" id="gender-female" name="gender" value="female">
                    <label style="width: auto;" for="gender-female">женский</label>
                </div>
                <div class="radio-item">
                    <input type="radio" id="gender-male" name="gender" value="male">
                    <label style="width: auto;" for="gender-male">мужской</label>
                </div>
            </div>
        </div>

        <!-- Блок Курс -->
        <h3>На каком курсе вы учитесь?</h3>
        <select name="course">
            <option value="1">первый</option>
            <option value="2">второй</option>
            <option value="3">третий</option>
            <option value="4">четвертый</option>
            <option value="5">пятый</option>
        </select>

        <!-- Блок Языки программирования -->
        <h3>Какие языки программирования вы знаете?</h3>
        <div class="checkbox-group">
            <div>
                <input type="checkbox" id="lang-pascal" name="languages" value="pascal">
                <label style="width: auto;" for="lang-pascal">Паскаль</label>
            </div>
            <div>
                <input type="checkbox" id="lang-c" name="languages" value="c">
                <label style="width: auto;" for="lang-c">СИ</label>
            </div>
            <div>
                <input type="checkbox" id="lang-assembler" name="languages" value="assembler">
                <label style="width: auto;" for="lang-assembler">Ассемблер</label>
            </div>
        </div>

        <!-- Блок О себе -->
        <h3>Напишите несколько слов о себе</h3>
        <div>
            <textarea name="about"></textarea>
        </div>

        <!-- Кнопки управления -->
        <div class="buttons-container">
            <input type="submit" value="Отправка данных">
            <input type="reset" value="Сброс значений полей">
        </div>

    </form>

</body>
</html>
