<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Форма с выводом данных</title>
    <style>
        /* Основной контейнер, чтобы форма была слева, а вывод — справа */
        .main-container {
            display: flex;
            gap: 40px;
            font-family: Arial, sans-serif;
            margin: 20px;
            max-width: 1000px;
        }
        
        /* Стили формы строго по картинке */
        .form-side {
            width: 500px;
            flex-shrink: 0;
        }
        h2 {
            font-family: "Times New Roman", Times, serif;
            font-size: 28px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 25px;
            margin-top: 0;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: inline-block;
            width: 90px;
            vertical-align: top;
        }
        .form-group input[type="text"] {
            width: 180px;
            padding: 2px;
        }
        .radio-group {
            display: inline-block;
        }
        .radio-item {
            margin-bottom: 5px;
        }
        h3 {
            font-size: 16px;
            font-weight: bold;
            margin-top: 25px;
            margin-bottom: 15px;
        }
        select {
            width: 150px;
            padding: 2px;
        }
        .checkbox-group {
            line-height: 1.6;
        }
        textarea {
            width: 450px;
            height: 180px;
            resize: none;
        }
        .buttons-container {
            margin-top: 25px;
        }
        input[type="button"], input[type="reset"] {
            padding: 5px 20px;
            margin-right: 10px;
            font-size: 14px;
            cursor: pointer;
        }

        /* Правая панель для вывода результатов */
        .result-side {
            flex-grow: 1;
            border-left: 2px dashed #ccc;
            padding-left: 40px;
            background-color: #f9f9f9;
            padding: 20px;
            border-radius: 8px;
            height: fit-content;
        }
        .result-side h2 {
            text-transform: none;
            font-family: Arial, sans-serif;
            font-size: 22px;
            color: #333;
        }
        .result-item {
            margin-bottom: 15px;
            font-size: 16px;
        }
        .result-item strong {
            color: #555;
        }
        .result-text-box {
            background: #fff;
            border: 1px solid #ccc;
            padding: 10px;
            min-height: 50px;
            white-space: pre-wrap;
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <div class="main-container">
        
        <!-- ЛЕВАЯ СТОРОНА: ФОРМА -->
        <div class="form-side">
            <h2>Анкета</h2>
            <form id="anketaForm">
                
                <div class="form-group">
                    <label for="username">Вше имя</label>
                    <input type="text" id="username" name="username">
                </div>

                <div class="form-group">
                    <label>Ваш пол</label>
                    <div class="radio-group">
                        <div class="radio-item">
                            <input type="radio" id="gender-female" name="gender" value="женский">
                            <label style="width: auto;" for="gender-female">женский</label>
                        </div>
                        <div class="radio-item">
                            <input type="radio" id="gender-male" name="gender" value="мужской">
                            <label style="width: auto;" for="gender-male">мужской</label>
                        </div>
                    </div>
                </div>

                <h3>На каком курсе вы учитесь?</h3>
                <select name="course" id="course">
                    <option value="первый">первый</option>
                    <option value="второй">второй</option>
                    <option value="третий">третий</option>
                    <option value="четвертый">четвертый</option>
                    <option value="пятый">пятый</option>
                </select>

                <h3>Какие языки программирования вы знаете?</h3>
                <div class="checkbox-group">
                    <div>
                        <input type="checkbox" id="lang-pascal" name="languages" value="Паскаль">
                        <label style="width: auto;" for="lang-pascal">Паскаль</label>
                    </div>
                    <div>
                        <input type="checkbox" id="lang-c" name="languages" value="СИ">
                        <label style="width: auto;" for="lang-c">СИ</label>
                    </div>
                    <div>
                        <input type="checkbox" id="lang-assembler" name="languages" value="Ассемблер">
                        <label style="width: auto;" for="lang-assembler">Ассемблер</label>
                    </div>
                </div>

                <h3>Напишите несколько слов о себе</h3>
                <div>
                    <textarea id="about" name="about"></textarea>
                </div>

                <div class="buttons-container">
                    <input type="button" id="submitBtn" value="Отправка данных">
                    <input type="reset" id="resetBtn" value="Сброс значений полей">
                </div>

            </form>
        </div>

        <!-- ПРАВАЯ СТОРОНА: ВЫВОД ДАННЫХ -->
        <div class="result-side">
            <h2>Вы ввели:</h2>
            
            <div class="result-item">
                <strong>Имя:</strong> <span id="res-name">—</span>
            </div>
            
            <div class="result-item">
                <strong>Пол:</strong> <span id="res-gender">—</span>
            </div>
            
            <div class="result-item">
                <strong>Курс:</strong> <span id="res-course">первый</span>
            </div>
            
            <div class="result-item">
                <strong>Языки:</strong> <span id="res-langs">ничего не выбрано</span>
            </div>
            
            <div class="result-item">
                <strong>О себе:</strong>
                <div class="result-text-box" id="res-about">—</div>
            </div>
        </div>

    </div>

    <!-- СКРИПТ ДЛЯ ЖИВОГО ОБНОВЛЕНИЯ ДАННЫХ -->
    <script>
        const form = document.getElementById('anketaForm');

        function updatePreview() {
            // 1. Имя
            const nameInput = document.getElementById('username').value;
            document.getElementById('res-name').textContent = nameInput || '—';

            // 2. Пол
            const genderInput = form.querySelector('input[name="gender"]:checked');
            document.getElementById('res-gender').textContent = genderInput ? genderInput.value : '—';

            // 3. Курс
            const courseSelect = document.getElementById('course').value;
            document.getElementById('res-course').textContent = courseSelect;

            // 4. Языки программирования
            const checkedLangs = form.querySelectorAll('input[name="languages"]:checked');
            const langsArray = [];
            checkedLangs.forEach(cb => langsArray.push(cb.value));
            document.getElementById('res-langs').textContent = langsArray.length > 0 ? langsArray.join(', ') : 'ничего не выбрано';

            // 5. О себе
            const aboutText = document.getElementById('about').value;
            document.getElementById('res-about').textContent = aboutText || '—';
        }

        // Слушаем любые изменения в форме для мгновенного вывода
        form.addEventListener('input', updatePreview);
        form.addEventListener('change', updatePreview);

        // При сбросе формы очищаем и правое окно
        document.getElementById('resetBtn').addEventListener('click', () => {
            setTimeout(updatePreview, 50);
        });

        // Кнопка отправки просто фиксирует данные всплывающим окном alert
        document.getElementById('submitBtn').addEventListener('click', () => {
            alert('Данные зафиксированы и выведены справа!');
        });
    </script>

</body>
</html>
