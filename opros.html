<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Анкета</title>
</head>
<body>

    <h2>Анкета</h2>

    <!-- Используем таблицу, чтобы форма была слева, а вывод — справа -->
    <table border="0" cellpadding="10" cellspacing="0">
        <tr>
            <!-- Левая колонка: Сама форма -->
            <td valign="top" width="400">
                <form id="surveyForm">
                    <p>
                        Ваше имя:<br>
                        <input type="text" id="username" name="username">
                    </p>
                    
                    <p>
                        Из какого вы города?<br>
                        <input type="text" id="city" name="city">
                    </p>

                    <p>
                        Ваш пол:<br>
                        <input type="radio" id="female" name="gender" value="Женский">
                        <label for="female">женский</label>
                        <input type="radio" id="male" name="gender" value="Мужской">
                        <label for="male">мужской</label>
                    </p>

                    <p>
                        На каком курсе вы учитесь?<br>
                        <select id="course" name="course">
                            <option value="Не выбран">—</option>
                            <option value="1 курс">первый</option>
                            <option value="2 курс">второй</option>
                            <option value="3 курс">третий</option>
                            <option value="4 курс">четвертый</option>
                            <option value="5 курс">пятый</option>
                        </select>
                    </p>

                    <p>
                        Какие языки программирования вы знаете?<br>
                        <input type="checkbox" id="pascal" name="languages" value="Паскаль">
                        <label for="pascal">Паскаль</label><br>
                        <input type="checkbox" id="c" name="languages" value="Си">
                        <label for="c">СИ</label><br>
                        <input type="checkbox" id="assembler" name="languages" value="Ассемблер">
                        <label for="assembler">Ассемблер</label>
                    </p>

                    <p>
                        Напишите несколько слов о себе:<br>
                        <textarea id="about" name="about" rows="4" cols="30"></textarea>
                    </p>

                    <p>
                        <button type="submit">Отправка данных</button>
                        <button type="reset" id="resetBtn">Сброс значений полей</button>
                    </p>
                </form>
            </td>

            <!-- Правая колонка: Что ввел пользователь -->
            <td valign="top" style="border-left: 1px solid #ccc; padding-left: 20px;">
                <h3>Вы ввели:</h3>
                <p>Имя: <span id="viewName">—</span></p>
                <p>Город: <span id="viewCity">—</span></p>
                <p>Пол: <span id="viewGender">—</span></p>
                <p>Курс: <span id="viewCourse">Не выбран</span></p>
                <p>Языки: <span id="viewLanguages">—</span></p>
                <p>О себе: <span id="viewAbout">—</span></p>
            </td>
        </tr>
    </table>

    <script>
        const form = document.getElementById('surveyForm');

        function updatePreview() {
            document.getElementById('viewName').textContent = form.username.value || '—';
            document.getElementById('viewCity').textContent = form.city.value || '—';
            document.getElementById('viewCourse').textContent = form.course.value;
            document.getElementById('viewAbout').textContent = form.about.value || '—';

            const genderChecked = form.querySelector('input[name="gender"]:checked');
            document.getElementById('viewGender').textContent = genderChecked ? genderChecked.value : '—';

            const langBoxes = form.querySelectorAll('input[name="languages"]:checked');
            const selectedLangs = Array.from(langBoxes).map(box => box.value);
            document.getElementById('viewLanguages').textContent = selectedLangs.length > 0 ? selectedLangs.join(', ') : '—';
        }

        form.addEventListener('input', updatePreview);
        form.addEventListener('change', updatePreview);
        document.getElementById('resetBtn').addEventListener('click', () => {
            setTimeout(updatePreview, 10);
        });
    </script>

</body>
</html>
