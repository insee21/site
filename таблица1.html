<body>

    <table>
        <!-- Строка 1: Самая верхняя длинная полоса спирали -->
        <tr>
            <td colspan="10"></td>
        </tr>
        <!-- Строка 2 -->
        <tr>
            <td rowspan="8"></td> <!-- Левая внешняя стена -->
            <td colspan="8"></td> <!-- Верхний внутренний виток -->
            <td rowspan="8"></td> <!-- Правая внешняя стена -->
        </tr>
        <!-- Строка 3 -->
        <tr>
            <td rowspan="6"></td> <!-- Левый виток 2 -->
            <td colspan="6"></td> <!-- Верхний виток 3 -->
            <td rowspan="6"></td> <!-- Правый виток 2 -->
        </tr>
        <!-- Строка 4 -->
        <tr>
            <td rowspan="4"></td> <!-- Левый виток 3 -->
            <td colspan="4"></td> <!-- Верхний виток 4 -->
            <td rowspan="4"></td> <!-- Правый виток 3 -->
        </tr>
        <!-- Строка 5: Центр (два финальных квадрата) -->
        <tr>
            <td colspan="2"></td>
            <td colspan="2"></td>
        </tr>
        <!-- Строка 6 -->
        <tr>
            <td colspan="4"></td> <!-- Нижний виток 4 -->
        </tr>
        <!-- Строка 7 -->
        <tr>
            <td colspan="6"></td> <!-- Нижний виток 3 -->
        </tr>
        <!-- Строка 8 -->
        <tr>
            <td colspan="8"></td> <!-- Нижний виток 2 -->
        </tr>
        <!-- Строка 9: Самая нижняя длинная полоса спирали -->
        <tr>
            <td colspan="10"></td>
        </tr>
    </table>

</body>
